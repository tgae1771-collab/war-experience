
<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>전쟁 체험</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="phone" aria-label="가상 아이폰">

    <!-- 아이폰 상단 상태 표시줄 -->
    <header class="status">
      <time id="clock">9:41</time>

      <div class="status-icons" aria-label="연결 상태">
        <span>●●●</span>
        <span>Wi-Fi</span>
        <span class="battery">100</span>
      </div>
    </header>

    <!-- 다이내믹 아일랜드 -->
    <div class="dynamic-island" aria-hidden="true"></div>

    <!-- 앱 화면 -->
    <section id="screen" aria-label="아이폰 화면"></section>

    <!-- 저장 상태 안내 -->
    <p id="storage-status" role="status" hidden></p>

    <!-- 하단 홈 인디케이터 -->
    <footer class="phone-footer">
      <button id="home" type="button" aria-label="홈으로">
        <span></span>
      </button>
    </footer>

  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
